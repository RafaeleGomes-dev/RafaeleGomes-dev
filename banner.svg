<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- decorative code glyphs -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" fill="#ffffff" opacity="0.10" font-size="20">
    <text x="60" y="48">const</text>
    <text x="150" y="48">app</text>
    <text x="210" y="48">=</text>
    <text x="235" y="48">build();</text>
    <text x="870" y="60">{ "status": "ok" }</text>
    <text x="930" y="210">SELECT * FROM usinas;</text>
    <text x="70" y="220">git commit -m "deploy"</text>
  </g>

  <!-- node/graph motif -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.55" fill="none">
    <line x1="980" y1="70" x2="1070" y2="110"/>
    <line x1="1070" y1="110" x2="1040" y2="180"/>
    <line x1="1070" y1="110" x2="1140" y2="150"/>
    <line x1="980" y1="70" x2="1040" y2="180"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="980" cy="70" r="6"/>
    <circle cx="1070" cy="110" r="7"/>
    <circle cx="1040" cy="180" r="6"/>
    <circle cx="1140" cy="150" r="6"/>
  </g>

  <!-- angle brackets -->
  <text x="60" y="165" font-family="SFMono-Regular, Consolas, monospace" font-size="110" fill="url(#accent)" opacity="0.9">&lt;/&gt;</text>

  <!-- main title -->
  <text x="330" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">Rafaele Gomes</text>
  <text x="330" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Desenvolvedora de Software · Clean Architecture &amp; SOLID</text>

  <!-- tag pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="330" y="190" width="82" height="28" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="345" y="209" fill="#7dd3fc">Node.js</text>

    <rect x="422" y="190" width="68" height="28" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="437" y="209" fill="#7dd3fc">React</text>

    <rect x="500" y="190" width="78" height="28" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="514" y="209" fill="#7dd3fc">NestJS</text>

    <rect x="588" y="190" width="100" height="28" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="601" y="209" fill="#7dd3fc">PostgreSQL</text>

    <rect x="698" y="190" width="86" height="28" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="711" y="209" fill="#7dd3fc">TypeScript</text>
  </g>
</svg>
